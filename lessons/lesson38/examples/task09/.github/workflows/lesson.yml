name: Lint, test and build dependencies
'on':
  push: {}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: python -m pip install flake8
    - run: flake8 src/
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: python -m pip install -r requirements.txt
    - run: python -m pytest
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - run: python -m compileall -q src
    needs:
    - lint
    - test
