name: OS matrix and exclusions
'on':
  push: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r requirements.txt
    - run: python -m pytest
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        python:
        - '3.9'
        - '3.10'
        - '3.11'
        exclude:
        - os: macos-latest
          python: '3.9'
