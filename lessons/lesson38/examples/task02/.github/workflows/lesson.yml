name: Python 3.11 on the runner
'on':
  push: {}
permissions:
  contents: read
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: python hello.py
