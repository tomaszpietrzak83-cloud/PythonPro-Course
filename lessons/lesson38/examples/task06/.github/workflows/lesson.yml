name: Python version matrix
'on':
  push: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r requirements.txt
    - run: python -m pytest
    strategy:
      matrix:
        python:
        - '3.9'
        - '3.10'
        - '3.11'
