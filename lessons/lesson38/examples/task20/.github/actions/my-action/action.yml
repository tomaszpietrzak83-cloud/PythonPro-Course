name: Tests and coverage badge
description: Runs tests and creates a coverage SVG
runs:
  using: composite
  steps:
  - shell: bash
    run: python -m pip install -r requirements.txt
  - shell: bash
    run: python -m pytest --cov=src --cov-report=xml:coverage.xml
  - shell: bash
    run: python "$GITHUB_ACTION_PATH/badge.py" coverage.xml coverage.svg
