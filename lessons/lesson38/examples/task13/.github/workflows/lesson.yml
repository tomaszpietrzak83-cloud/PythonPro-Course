name: Lint, test, build and deploy pipeline
'on':
  push: {}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: python -m pip install flake8 black
    - run: flake8 src && black --check src
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: python -m pip install -r requirements.txt pytest-cov
    - run: python -m pytest --cov=src
    needs: lint
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - run: docker build -t lesson-ci .
    - run: docker run --rm lesson-ci
    needs: test
  deploy:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Deploying..."
    needs: build
    if: github.ref == 'refs/heads/main'
