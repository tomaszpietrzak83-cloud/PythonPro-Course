{% extends 'base.html' %}

{% block title %}{{ game.title }} | GameShelf{% endblock %}

{% block content %}
    <a class="text-link" href="{% url 'gameshelf:game_list' %}">← Back to game catalog</a>

    <article class="detail-card">
        <p class="eyebrow">Game details</p>
        <h2>{{ game.title }}</h2>
        <p class="detail-description">{{ game.description }}</p>

        {% if game.release_date %}
            <p class="release-date">Released {{ game.release_date|date:"F j, Y" }}</p>
        {% endif %}
    </article>
{% endblock %}
