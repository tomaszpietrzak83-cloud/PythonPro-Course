{% extends 'base.html' %} {% block title %}Log in | GameShelf{% endblock %} {%
block content %}
<section class="auth-card">
  <p class="eyebrow">Your collection awaits</p>
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %} {{ form.as_p }} {% if next %}<input
      type="hidden"
      name="next"
      value="{{ next }}"
    />{% endif %}
    <button class="button" type="submit">Log in</button>
  </form>
  <p class="auth-switch">
    New here?
    <a class="text-link" href="{% url 'gameshelf:register' %}"
      >Create an account</a
    >
  </p>
</section>
{% endblock %}
