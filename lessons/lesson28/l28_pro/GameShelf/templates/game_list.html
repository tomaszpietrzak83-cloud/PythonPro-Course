{% extends 'base.html' %}

{% block title %}Game List{% endblock %}

{% block content %}
    <p>
        <a href="{% url 'gameshelf:home' %}">Back to homepage</a>
    </p>
    <ul>
    {% for game in games %}
        <li>Title: {{ game.title }}<br><br> 
            Description:<br>
               {{ game.description }}
        </li><br>
    {% endfor %}
    </ul>

{% endblock %}
