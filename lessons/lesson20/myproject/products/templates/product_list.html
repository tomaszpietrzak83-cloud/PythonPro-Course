{% extends 'base.html' %}

{% block title %}Product List:{% endblock %}

{% block content %}    
    <ul>
      {% for product in products %}
        <li>
          {{ product.name }} - {{ product.price }} - {{ product.description }}
        </li>
      {% empty %}
        <li>Brak produktów.</li>
      {% endfor %}
    </ul>
{% endblock %}
