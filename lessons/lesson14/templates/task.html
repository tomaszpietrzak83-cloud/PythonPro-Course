<link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">

<main class="task-container">    

    <h1>{{ task["name"] }}</h1>

    <h2>Here is the solution code:</h2>

    <a class="home-link" href="{{ url_for('index') }}" class="home-link">← Back to Home</a>

    <div class="code-box">
        {{ code|safe }}
    </div>

    <h2>Result:</h2>

    <div class="result-box">

        {{ task["result_text"] }}

        {% if result is iterable and result is not string %}

        <div class="result-item">
        
            {% for item in result %}
                <p>{{ item }}</p>
            {% endfor %}
        </div>

        {% else %}

            <p>{{ result }}</p>

        {% endif %}

        
    </div>
    <a class="home-link" href="{{ url_for('index') }}" class="home-link">← Back to Home</a>
</main>
