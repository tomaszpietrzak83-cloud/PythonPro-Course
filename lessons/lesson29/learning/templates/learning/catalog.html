{% load learning_assets %}
<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celery Lab · Zadania</title><link rel="stylesheet" href="{% versioned_static 'learning/app.css' %}"><link rel="stylesheet" href="{% versioned_static 'learning/course.css' %}"><link rel="stylesheet" href="{% versioned_static 'learning/navigation.css' %}"></head>
<body class="catalog-body"><div class="catalog-shell"><header class="course-header"><a class="brand" href="/">◈ CELERY LAB</a><div class="languages" role="group" aria-label="Language"><button id="pl">PL</button><button id="en">ENG</button></div></header><main class="catalog-main"><p class="eyebrow">LESSON 29 / DJANGO + CELERY</p><h1 data-pl="Wybierz zadanie." data-en="Choose a task."></h1><p data-pl="Wszystkie 20 zadań ma działające rozwiązania. Wybierz kafelek, aby zacząć od wstępu." data-en="All 20 tasks have working solutions. Select a tile to begin with the introduction."></p><div class="task-grid">{% for item in catalog %}{% if item.available %}<a class="task-tile" href="{% url 'lesson' item.number %}"><span>{{ item.label }}</span><h2 data-pl="{{ item.pl }}" data-en="{{ item.en }}"></h2><b>↗</b></a>{% else %}<div class="task-tile unavailable" aria-disabled="true"><span>{{ item.label }}</span><h2 data-pl="{{ item.pl }}" data-en="{{ item.en }}"></h2></div>{% endif %}{% endfor %}</div><p class="muted" data-pl="Każde zadanie: wstęp, przykłady, kod krok po kroku i pytania." data-en="Each task: introduction, examples, step-by-step code and questions."></p></main></div><script src="{% versioned_static 'learning/navigation.js' %}"></script></body></html>
