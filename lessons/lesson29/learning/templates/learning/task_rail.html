<div class="task-rail" id="task-rail"><button class="rail-trigger" id="task-list-toggle" aria-expanded="false" aria-controls="task-drawer" data-pl="☰" data-en="☰" aria-label="Lista zadań / Task list">☰</button><div class="task-drawer" id="task-drawer" inert><div class="drawer-heading"><strong data-pl="Zadania" data-en="Tasks">Zadania</strong><button id="task-list-close" aria-label="Zamknij / Close">×</button></div><a class="drawer-home" href="/" data-pl="← Wróć do listy zadań" data-en="← Back to the task list"></a><nav class="drawer-list" aria-label="Tasks">{% for item in catalog %}{% if item.available %}<a href="{% url 'lesson' item.number %}" {% if item.number == task.number %}aria-current="page"{% endif %}><span>{{ item.label }}</span><span data-pl="{{ item.pl }}" data-en="{{ item.en }}"></span></a>{% else %}<span class="drawer-unavailable" aria-disabled="true"><span>{{ item.label }}</span><span data-pl="{{ item.pl }}" data-en="{{ item.en }}"></span></span>{% endif %}{% endfor %}</nav></div></div>
