services:
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://lesson:lesson-local@database:5432/lesson
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: lesson
      POSTGRES_USER: lesson
      POSTGRES_PASSWORD: lesson-local
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 3s
      timeout: 3s
      retries: 15
  nginx:
    image: nginx:alpine
    ports:
    - 127.0.0.1:3000:80
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./static:/srv/static:ro
    depends_on:
    - backend
