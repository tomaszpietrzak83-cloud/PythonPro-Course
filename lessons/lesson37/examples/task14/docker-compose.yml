services:
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://lesson:lesson-local@database:5432/lesson
      REDIS_URL: redis://redis:6379/0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - 127.0.0.1:3000:8000
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://lesson:lesson-local@database:5432/lesson
      REDIS_URL: redis://redis:6379/0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
    - celery
    - -A
    - web:celery
    - worker
    - --loglevel=info
    - --concurrency=2
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 15
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: lesson
      POSTGRES_USER: lesson
      POSTGRES_PASSWORD: lesson-local
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 3s
      timeout: 3s
      retries: 15
