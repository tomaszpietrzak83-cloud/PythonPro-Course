services:
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://lesson:lesson-local@database:5432/lesson
    depends_on:
      database:
        condition: service_healthy
    ports:
    - 127.0.0.1:3000:8000
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: lesson
      POSTGRES_USER: lesson
      POSTGRES_PASSWORD: lesson-local
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 3s
      timeout: 3s
      retries: 15
  prometheus:
    image: prom/prometheus
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana
    ports:
    - 127.0.0.1:3001:3000
    volumes:
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
