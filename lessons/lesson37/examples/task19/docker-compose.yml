services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: lesson
      POSTGRES_USER: lesson
      POSTGRES_PASSWORD: lesson-local
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 3s
      timeout: 3s
      retries: 15
  init:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-lesson-local-demo}
    command:
    - sh
    - /app/init.sh
  backend:
    build: .
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:3000:8000
