services:
  backend:
    build: .
    deploy:
      replicas: 3
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
    - redis
  redis:
    image: redis:7-alpine
  nginx:
    image: nginx:alpine
    ports:
    - 127.0.0.1:3000:80
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - backend
