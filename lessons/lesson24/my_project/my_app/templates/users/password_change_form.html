{% extends "base.html" %}

{% block content %}
    {# TASK 08 #}
    <section class="auth-layout">
        <div class="auth-intro">
            <p class="eyebrow">Account security</p>
            <h1>Keep your password fresh.</h1>
            <p>Use a strong password that you do not reuse on another website.</p>
        </div>

        <div class="auth-card">
            <form method="post">
                {% csrf_token %}
                <fieldset>
                    <legend>Change password</legend>
                    {{ form.as_p }}
                </fieldset>
                <button class="button" type="submit">
                    Save new password <i data-lucide="shield-check"></i>
                </button>
            </form>
        </div>
    </section>
{% endblock content %}
