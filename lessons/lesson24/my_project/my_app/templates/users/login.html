{% extends "base.html" %}
{% block title %}Log in · AuthSpace{% endblock title %}
{% block content %}
    <section class="auth-layout">
        <div class="auth-intro">
            <p class="eyebrow">Welcome back</p>
            <h1>Sign in to your space.</h1>
            <p>Enter your details to continue to your protected dashboard.</p>
        </div>

        <div class="auth-card">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend>Log in</legend>
                {{ form.as_p }}
            </fieldset>
            <button class="button" type="submit">
                Continue <i data-lucide="arrow-right"></i>
            </button>
        </form>
        <div class="auth-switch">
            Don't have an account? <a href="{% url 'register' %}">Create one</a>
        </div>
        </div>
    </section>
{% endblock content %}
