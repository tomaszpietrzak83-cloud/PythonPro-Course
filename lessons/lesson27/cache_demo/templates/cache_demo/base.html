{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson 27 · Cache Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23086b70'/%3E%3Cpath d='M20 8 32 20 20 32 8 20Z' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <!-- UI source: Bootstrap https://getbootstrap.com/docs/5.3/getting-started/introduction/
       Ready-made components use Bootstrap CSS and its JavaScript bundle.
       Version is pinned for reproducible lessons; demo behavior is our own JS. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="{% static 'cache_demo/styles.css' %}" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
      <a class="brand" href="/">◈ <span>Cache Lab</span> <small>LESSON 27</small></a>
      <div class="d-flex align-items-center gap-3">
        <a href="/" data-i18n="home">Home</a>
        <button id="language-toggle" class="btn btn-outline-light btn-sm" type="button" aria-label="Switch language">PL / ENG</button>
      </div>
    </div>
  </header>
  <main class="container py-4 py-lg-5">
    <div class="server-strip mb-4">
      <span class="status-dot"></span><strong>{{ backend }}</strong>
      <span>{{ project }}</span><span>127.0.0.1:{{ port }}</span>
      <span class="ms-auto" data-i18n="{% if manager %}controllerLabel{% else %}serverLabel{% endif %}">Current process</span>
    </div>
    {% block content %}{% endblock %}
  </main>
  <footer class="container py-4 footer"><span data-i18n="footer">Real Django requests. Real cache. A guided explanation.</span></footer>
  {{ boot|json_script:"demo-boot" }}
  <!-- Interactive accordion source: https://getbootstrap.com/docs/5.3/components/accordion/ -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="{% static 'cache_demo/app.js' %}"></script>
</body>
</html>
